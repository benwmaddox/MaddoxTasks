name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore MaddoxTasks.csproj

      - name: Build
        run: dotnet build MaddoxTasks.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/MaddoxTasks.Tests/MaddoxTasks.Tests.csproj -c Release --no-build
